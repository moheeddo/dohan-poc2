# KHNP Education AI Platform - Nginx Configuration
# 웹 포털 + API 리버스 프록시

server {
    listen 80;
    server_name _;

    # 웹 포털 (정적 파일)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 리버스 프록시
    location /api/ {
        proxy_pass http://app-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;  # LLM 생성 대기
        client_max_body_size 50m;  # PPT 업로드
    }

    # Health check
    location /health {
        proxy_pass http://app-backend:8080/health;
    }

    # API Docs
    location /docs {
        proxy_pass http://app-backend:8080/docs;
    }
    location /openapi.json {
        proxy_pass http://app-backend:8080/openapi.json;
    }
}
